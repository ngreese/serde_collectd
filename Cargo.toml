[package]
name = "serde_collectd"
version = "0.1.0"
edition = "2024"
description = "Serializing and deserializing of collectd binary format."
authors = [
  "Nathanael G. Reese <nathanaelreese@acm.org>",
]
repository = "https://github.com/ngreese/serde_collectd"
readme = "README.md"
license = "MIT"
keywords = [
  "serde",
  "collectd"
]
categories = [
  "encoding",
  "parsing",
]

[lib]
name = "serde_collectd"
path = "src/lib.rs"
test = true
doctest = true
crate-type = ["lib"]

[dependencies]
byteorder = "1.5.0"
bytes = "1.11.1"
nom = { version = "8.0.0", features = ["std"] }
serde = { version = "1.0", features = ["derive"] }
